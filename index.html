<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body>
    <header>
        <section class="title">
            LIBRARY
        </section>
        <section class="theme-button">
            <button id="toggle-btn">THEME</button>
        </section>
    </header>

    <main>

        <section class="main-header">
            <div class="title">
                <p>MY LIBRARY</p>
            </div>

            <div id="action-bar">
                <form>
                    <input type="text" placeholder="Procurar Por Livros" id="search-books">
                    <button id="add-book-btn">ADD BOOK</button>
                </form>
            </div>

            <nav class="nav-filter">
                <button id="all-btn">ALL</button>
                <button id="read-btn">READ</button>
                <button id="unread-btn">UNREAD</button>
                <button id="favorite-btn">FAVORITES</button>
                
            </nav>
        </section>

        <section id="books-container">

        </section>
    </main>

     <footer>
        <p class="footer-text">Books Manager by <a href="https://github.com/Thales-Chaves98">Thales Chaves</a></p>
    </footer>
    
    <section id="add-book-modal" class="modal">
        <div class="modal-content">
            <form class="book-form">
                    <label for="book-title">Título:</label>
                    <input type="text" id="book-title" class="form-input" autocomplete="off" placeholder="Digite o título do livro">
                    <label for="book-author">Autor:</label>
                    <input type="text" id="book-author" class="form-input" autocomplete="off" placeholder="Digite o nome do autor">
            </form>
            <div class="modal-actions">
                <button id="cancel-btn" type="button" class="cancel-btn">Cancelar</button>
                <button id="save-btn" type="button" class="save-btn">Salvar</button>
            </div>
        </div>
    </section>
    

    <section id="delete-modal" class="modal" >
        <div class="modal-content">
            <h2>EXCLUIR LIVRO ?</h2>
            <p>Tem certeza que deseja excluir esse livro ?</p>
            <p>Essa ação não poderá ser desfeita !</p>

            <div class="modal-actions">
                <button id="cancel-delete-btn" class="cancel-btn">Cancelar</button>
                <button id="confirm-delete-btn" class="save-btn">Excluir</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
