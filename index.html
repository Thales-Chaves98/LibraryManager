<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body>
    <header>
        <section class="title">
            LIBRARY
        </section>
        <section class="theme-button">
            <button id="toggle-btn">TEMA</button>
        </section>
    </header>

    <main>

        <section class="main-header">
            <div class="title">
                <p>MY LIBRARY</p>
            </div>

            <div id="action-bar">
                <form>
                    <input type="text" placeholder="Procurar Por Livros" id="search-books">
                    <button id="add-book-btn">ADD LIVRO</button>
                </form>
            </div>

            <nav class="nav-filter">
                <button id="all-btn">TODOS</button>
                <button id="read-btn">LIDOS</button>
                <button id="unread-btn">A LER</button>
                
            </nav>
        </section>

        <section id="books-container">
            <div class="empty-state">
                <span class="material-symbols-outlined">auto_stories_off</span>
                <p>Empty Shelves !</p>
            </div>
            
            <!-- Referencia para book-card no JS
            <div class="book-card">               
                <div class="book-description">
                    <p class="book-name">Fellowship of the Ring</p>
                    <p class="author-name">J.R.R. Tolkien</p>
                </div>
                <div class="book-actions"> 
                    <button class="read-btn"><span class="material-symbols-outlined">bookmark</span></button>
                    <button class="favorite-btn"><span class="material-symbols-outlined">favorite</span></button>
                    <button class="edit-btn"><span class="material-symbols-outlined">edit</span></button>
                    <button class="edit-btn"><span class="material-symbols-outlined">delete</span></button>
                </div>
            </div>
            -->
            
        </section>
    </main>

     <footer>
        <p class="footer-text">Library Manager made by <a href="https://github.com/Thales-Chaves98">Thales Chaves</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
